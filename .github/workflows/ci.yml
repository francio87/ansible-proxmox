---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: YAML, Ansible, and syntax checks
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validation tools
        run: >-
          python -m pip install
          ansible-core==2.21.3
          ansible-lint==26.8.0
          yamllint==1.38.0

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint setup.yml

      - name: Check Ansible syntax
        run: >-
          ansible-playbook
          -i tests/fixtures/inventory.ini
          --syntax-check
          setup.yml
